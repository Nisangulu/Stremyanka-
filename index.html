<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>stremyanka.uz 🌸</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
    }

    /* Фоновое изображение с затемнением */
    .hero {
      position: relative;
      height: 100vh;
      background: url('images/bg-ladder.jpg') center/cover no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.5); /* полупрозрачная тёмная подложка */
    }

    .hero-content {
      position: relative;
      z-index: 1;
    }

    .hero h1 {
      font-size: 3em;
      margin: 0 0 10px;
      color: #ffffff;
    }

    .hero p {
      font-size: 1.5em;
      margin: 0 0 20px;
      color: #f0f0f0;
    }

    .view-catalog-btn {
      display: inline-block;
      padding: 12px 25px;
      background: #00bcd4;
      color: #fff;
      font-weight: bold;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.3s;
    }

    .view-catalog-btn:hover {
      background: #0097a7;
    }

    /* Навигация */
    nav.menu {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      background: rgba(0,0,0,0.7);
      padding: 10px 0;
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 10;
    }

    nav.menu a {
      color: #ffffff;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 8px;
      transition: background 0.3s;
    }

    nav.menu a.active, nav.menu a:hover {
      background: #00bcd4;
      color: #fff;
    }

    /* Плавающая кнопка Telegram */
    .telegram-btn {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: #00bcd4;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      z-index: 1000;
    }

    .telegram-btn img {
      width: 30px;
      height: 30px;
      filter: invert(100%);
    }

    /* Навигационная иконка Telegram */
    .telegram-link img {
      width: 24px;
      height: 24px;
    }
  </style>
</head>
<body>

  <nav class="menu">
    <a href="index.html" class="active">Главная</a>
    <a href="catalog.html">Каталог</a>
    <a href="contact.html">Контакты</a>
    <a href="https://t.me/pismo_message" class="telegram-link" target="_blank" rel="noopener noreferrer">
      <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/telegram.svg" alt="Telegram" />
    </a>
  </nav>

  <section class="hero">
    <div class="hero-content">
      <h1>stremyanka.uz</h1>
      <p>Твоя лестница к стилю ✨</p>
      <a href="catalog.html" class="view-catalog-btn">Перейти в каталог</a>
    </div>
  </section>

  <!-- Плавающая кнопка Telegram -->
  <a href="https://t.me/pismo_message" class="telegram-btn" target="_blank" rel="noopener noreferrer">
    <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/telegram.svg" alt="Telegram" />
  </a>
<link rel="stylesheet" href="style.css">
<script src="script.js"></script>
<img src="images/bg-ladder.jpg" alt="Лестница">


</body>
</html>
